<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Привычки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <div class="container">
    <nav class="page-nav">
      <a class="nav-btn" href="index.html">Задачи</a>
      <a class="nav-btn active" href="habits.html">Привычки</a>
    </nav>

    <header class="header">
      <span class="header-badge">◆ учёт времени</span>
      <h1 class="title">Считай <span class="accent">часы</span></h1>
      <p class="subtitle">
        Добавляй время за день, ставь цели и смотри статистику по каждой
        привычке.
      </p>
    </header>

    <section class="stats">
      <div class="stat">
        <span class="stat-value" id="statToday">0 ч</span>
        <span class="stat-label">сегодня</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statWeek">0 ч</span>
        <span class="stat-label">за неделю</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="statBestStreak">0</span>
        <span class="stat-label">лучшая серия</span>
      </div>
      <div class="stat">
        <span class="stat-value stat-value-small" id="statActiveHabit">—</span>
        <span class="stat-label">активная</span>
      </div>
    </section>

    <form class="time-form" id="habitForm">
      <div class="add-input-wrap">
        <input
          class="add-input"
          id="habitNameInput"
          type="text"
          maxlength="60"
          placeholder="Название привычки"
          aria-label="Название привычки"
        />
      </div>
      <input
        class="add-input time-input-small"
        id="habitIconInput"
        type="text"
        maxlength="4"
        placeholder="🇬🇧"
        aria-label="Иконка привычки"
      />
      <input
        class="add-input time-input-small"
        id="habitGoalInput"
        type="text"
        inputmode="decimal"
        placeholder="Цель, ч"
        aria-label="Цель в часах"
      />
      <button class="add-btn" type="submit">
        <span class="add-btn-plus">+</span>Добавить
      </button>
    </form>
    <div class="form-hint" id="habitHint"></div>

    <div class="habit-list" id="habitsList"></div>
    <div class="empty-state" id="emptyHabits">
      Пока нет привычек.<br />Добавь первую выше ↑
    </div>

    <footer class="footer">
      Данные хранятся локально в этом браузере · <span id="todayDate"></span>
    </footer>
  </div>

  <script src="habits.js"></script>
</body>
</html>
